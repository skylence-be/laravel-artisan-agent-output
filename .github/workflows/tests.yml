name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/rector --dry-run

  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/pint --test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpstan

  tests:
    name: Tests - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: [rector, pint, phpstan]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/pest --exclude-group=subprocess
        env:
          AI_AGENT: test

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [rector, pint, phpstan, tests]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.rector.result }}" != "success" ] || \
             [ "${{ needs.pint.result }}" != "success" ] || \
             [ "${{ needs.phpstan.result }}" != "success" ] || \
             [ "${{ needs.tests.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
